<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <!-- คำสั่งนี้สำคัญมาก! ทำให้พอดีกับหน้าจอมือถือ -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>รายงานยอดขายประจำเดือน</title>
  
  <style>
    /* ตั้งค่าพฤติกรรมกล่องพื้นฐาน ป้องกันกรอบล้นหน้าจอ */
    *, *::before, *::after {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #f7f7f8; /* สีพื้นหลังหน้าจออ่อนๆ ให้การ์ดดูเด่นขึ้น */
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .wrap {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      padding: 16px;
    }

    .card {
      width: 100%;
      background: var(--color-background-primary, #ffffff);
      border: 0.5px solid var(--color-border-tertiary, #eaeaeb);
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.04);
      animation: fadeUp .4s ease both;
    }

    .section-title {
      font-size: 12px;
      font-weight: 500;
      color: var(--color-text-secondary, #666);
      margin: 0 0 10px;
      letter-spacing: .04em;
    }

    .input-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 0.5px solid var(--color-border-tertiary, #eaeaeb);
    }

    .input-row:last-of-type {
      border-bottom: none;
    }

    .input-label {
      font-size: 14px;
      color: var(--color-text-secondary, #444);
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .input-row input {
      width: 45%;
      min-width: 100px;
      text-align: right;
      font-size: 16px;
      font-weight: 500;
      border: 0.5px solid var(--color-border-secondary, #ccc);
      border-radius: 8px;
      padding: 8px 10px;
      background: var(--color-background-secondary, #f9f9f9);
      color: var(--color-text-primary, #333);
      /* ป้องกันมือถือซูมตอนกดพิมพ์ */
      appearance: none;
      -webkit-appearance: none;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 0.5px solid var(--color-border-tertiary, #eaeaeb);
    }

    .result-row:last-of-type {
      border-bottom: none;
    }

    .result-label {
      font-size: 14px;
      color: var(--color-text-secondary, #666);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .result-val {
      font-size: 16px;
      font-weight: 600;
      text-align: right;
    }

    .bar-track {
      background: var(--color-background-secondary, #eee);
      border-radius: 20px;
      height: 9px;
      overflow: hidden;
      margin: 4px 0;
    }

    .bar-fill {
      height: 100%;
      border-radius: 20px;
      background: #1D9E75;
      transition: width .8s ease;
    }

    .divider {
      border: none;
      border-top: 0.5px solid var(--color-border-tertiary, #eaeaeb);
      margin: 20px 0;
    }
  </style>
</head>
<body>

<div class="wrap">
  <div class="card">

    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:15px;font-weight:600;color:var(--color-text-secondary, #444);letter-spacing:.02em">📊 รายงานยอดขายประจำเดือน</div>
    </div>

    <div class="section-title">กรอกข้อมูล</div>
    <div class="input-row">
      <div class="input-label"><span>🎯</span> เป้าหมาย</div>
      <input id="target" type="number" value="277000" oninput="calc()">
    </div>
    <div class="input-row">
      <div class="input-label"><span>✅</span> ยอดขายสะสม</div>
      <input id="sold" type="number" value="276999" oninput="calc()">
    </div>
    <div class="input-row">
      <div class="input-label"><span>📅</span> วันที่เหลือ</div>
      <input id="days" type="number" value="4" min="0" oninput="calc()">
    </div>

    <div class="divider"></div>

    <div style="position:relative;width:160px;height:160px;margin:0 auto 20px">
      <svg width="160" height="160" viewBox="0 0 156 156" fill="none" xmlns="http://www.w3.org/2000/svg" style="overflow: visible;">
        <circle cx="78" cy="78" r="62" stroke="#E1F5EE" stroke-width="15"/>
        <circle id="arc" cx="78" cy="78" r="62" stroke="#1D9E75" stroke-width="15" stroke-linecap="round" stroke-dasharray="389.6" stroke-dashoffset="389.6" transform="rotate(-90 78 78)" style="transition:stroke-dashoffset .8s ease"/>
        <circle id="arc2" cx="78" cy="78" r="62" stroke="#FFCA28" stroke-width="15" stroke-linecap="round" stroke-dasharray="389.6" stroke-dashoffset="389.6" transform="rotate(-90 78 78)" style="transition:stroke-dashoffset .8s ease; display:none; filter: drop-shadow(0 0 6px rgba(255, 202, 40, 0.8));"/>
      </svg>
      <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;line-height:1.2">
        <div id="pct-num" style="font-size:30px;font-weight:600;color:var(--color-text-primary, #222)">0.00%</div>
        <div style="font-size:12px;color:var(--color-text-secondary, #666)">ถึงเป้า</div>
      </div>
    </div>

    <div style="margin-bottom:8px">
      <div class="bar-track"><div id="bar" class="bar-fill" style="width:0%"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--color-text-secondary, #888);margin-top:6px">
        <span>0</span><span id="bar-max">0</span>
      </div>
    </div>

    <div class="divider"></div>

    <div class="result-row">
      <div class="result-label"><span>🎯</span> เป้าหมาย</div>
      <div id="r-target" class="result-val" style="color:var(--color-text-primary, #333)">0</div>
    </div>
    <div class="result-row">
      <div class="result-label"><span>✅</span> ขายได้แล้ว</div>
      <div id="r-sold" class="result-val" style="color:#1D9E75">0</div>
    </div>
    <div class="result-row">
      <div class="result-label"><span>⏳</span> คงเหลือ</div>
      <div id="r-remain" class="result-val" style="color:#D85A30">0</div>
    </div>
    <div class="result-row">
      <div class="result-label"><span>🔥</span> ต้องขายขั้นต่ำต่อวัน</div>
      <div id="r-daily" class="result-val" style="color:#BA7517">~0</div>
    </div>
    <div class="result-row">
      <div class="result-label"><span>📅</span> เหลือเวลา</div>
      <div id="r-days" class="result-val" style="color:var(--color-text-primary, #333)">0 วัน</div>
    </div>

    <div id="badge" style="text-align:center;margin-top:24px; line-height: 1.5;"></div>

  </div>
</div>

<script>
function fmt(n){return Math.round(n).toLocaleString('th-TH')}
function calc(){
  var target = parseFloat(document.getElementById('target').value) || 0;
  var sold = parseFloat(document.getElementById('sold').value) || 0;
  var days = Math.max(parseFloat(document.getElementById('days').value) || 0, 0); 
  
  var remain = Math.max(target - sold, 0);
  
  var daily = 0;
  if (remain > 0) {
    daily = days > 0 ? Math.ceil(remain / days) : remain;
  }
  
  var pct = target > 0 ? (sold / target * 100) : 0;
  var circ = 389.6;
  
  var visualPct1 = Math.min(pct, 100);
  var offset1 = circ - (circ * visualPct1 / 100);
  document.getElementById('arc').setAttribute('stroke-dashoffset', offset1.toFixed(1));
  
  var arc2 = document.getElementById('arc2');
  if (sold > target) { 
    var overPct = pct - 100;
    var visualPct2 = Math.min(overPct, 100);
    var offset2 = circ - (circ * visualPct2 / 100);
    arc2.setAttribute('stroke-dashoffset', offset2.toFixed(1));
    arc2.style.display = 'block'; 
  } else {
    arc2.setAttribute('stroke-dashoffset', circ);
    arc2.style.display = 'none'; 
  }

  var displayPct = (Math.floor(pct * 100) / 100).toFixed(2);
  document.getElementById('pct-num').textContent = displayPct + '%';
  
  var visualPctBar = Math.min(pct, 100);
  document.getElementById('bar').style.width = visualPctBar + '%';
  
  document.getElementById('bar-max').textContent = fmt(target);
  document.getElementById('r-target').textContent = fmt(target);
  document.getElementById('r-sold').textContent = fmt(sold);
  document.getElementById('r-remain').textContent = fmt(remain);
  document.getElementById('r-daily').textContent = remain > 0 ? '~' + fmt(daily) : '0';
  document.getElementById('r-days').textContent = days + ' วัน';

  var badge = document.getElementById('badge');
  
  if (sold >= target && target > 0) {
    badge.innerHTML = '<span style="background:#EAF3DE;color:#3B6D11;font-size:13px;font-weight:600;padding:10px 20px;border-radius:24px;display:inline-block;box-shadow: 0 2px 10px rgba(59, 109, 17, 0.15);">🎉 ทะลุเป้าแล้ว! ยอดเยี่ยมมาก!</span>';
  } else if (pct >= 80) {
    badge.innerHTML = '<span style="background:#EAF3DE;color:#3B6D11;font-size:13px;font-weight:600;padding:10px 20px;border-radius:24px;display:inline-block">💪🔥 เหลืออีกนิดเดียว — สู้ๆ! 🚀</span>';
  } else if (pct >= 50) {
    badge.innerHTML = '<span style="background:#FAEEDA;color:#633806;font-size:13px;font-weight:600;padding:10px 20px;border-radius:24px;display:inline-block">💪 ลุยกันต่อ Incentive ต่อเนื่อง ยังไม่จบ 🎉</span>';
  } else {
    badge.innerHTML = '<span style="background:#FAECE7;color:#712B13;font-size:13px;font-weight:600;padding:10px 20px;border-radius:24px;display:inline-block">💪 Incentive ใกล้ครึ่งทางแล้ว</span>';
  }
}

window.onload = calc;
</script>

</body>
</html>
